<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strona nie została znaleziona — Moje Cyfrowe Prawa</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .notfound { min-height: 70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding: var(--space-xl) var(--space-m); }
  .notfound .pixel-figure { width: 220px; margin-bottom: var(--space-l); }
  .notfound .pixel-figure { position: relative; animation: pixel-idle 4.5s ease-in-out infinite; transform-origin: 50% 100%; }
  .notfound .pixel-figure img { width: 100%; height: auto; display: block; }
  .notfound .pixel-figure__blink { position: absolute; inset: 0; opacity: 0; animation: pixel-blink 4.2s linear 1s infinite; }
  @media (prefers-reduced-motion: reduce) { .notfound .pixel-figure, .notfound .pixel-figure__blink { animation: none; } }
  .notfound h1 { font-family: var(--font-display); font-weight: 500; }
</style>
</head>
<body>
<main class="notfound">
  <div class="pixel-figure">
    <img src="assets/img/pixel/pixel-body.png" alt="Pixel wygląda na lekko zagubionego" width="1269" height="1019" loading="eager" decoding="async" />
    <img class="pixel-figure__blink" src="assets/img/pixel/pixel-body-blink.png" alt="" width="1269" height="1019" decoding="async" />
  </div>
  <h1>Ups, tej strony tu nie ma</h1>
  <p class="lede">Nawet Pixel czasem się zgubi. Wróćmy razem na stronę główną.</p>
  <a class="btn btn--primary" href="/index.html">Strona główna</a>
</main>
</body>
</html>
